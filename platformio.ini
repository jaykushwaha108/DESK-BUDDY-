; ==========================================
; PLATFORMIO CONFIGURATION WITH OTA SUPPORT
; ==========================================

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Dual OTA partition table (app0: 1.9MB, app1: 1.9MB)
board_build.partitions = min_spiffs.csv

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    Wire

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ==========================================
; WIRELESS OTA UPLOAD ENVIRONMENT (Cable-Free)
; ==========================================
; When connected to the "my bot" Wi-Fi network,
; select this environment to upload firmware wirelessly over the air:
[env:esp32-c3-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv

upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=88888888

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    Wire

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
